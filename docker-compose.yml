version: '3.8'

services:
  # PromptOps Application
  promptops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promptops-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET:-your-session-secret-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-your-encryption-key-32chars}
      # Optional: LLM Provider Keys
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Optional: GitHub Integration
      - GITHUB_OWNER=${GITHUB_OWNER:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - promptops-network
    # Uncomment if using local PostgreSQL
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # Optional: Local PostgreSQL Database
  # Uncomment this section if you want to run PostgreSQL locally
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: promptops-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER:-promptops}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-promptops123}
  #     - POSTGRES_DB=${POSTGRES_DB:-promptops}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promptops} -d ${POSTGRES_DB:-promptops}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - promptops-network

networks:
  promptops-network:
    driver: bridge

