[project]
name = "promptops-sdk"
version = "1.0.0"
description = "Framework-agnostic runtime SDK for PromptOps — fetch, version, and render prompts at runtime on any cloud or compute platform."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PromptOps" }]
keywords = ["prompts", "llm", "ai", "prompt-management", "mlops", "promptops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
async = ["httpx>=0.25.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "respx>=0.20"]

[project.urls]
Homepage = "https://github.com/baatasaari/promptops"
Documentation = "https://github.com/baatasaari/promptops#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promptops"]
